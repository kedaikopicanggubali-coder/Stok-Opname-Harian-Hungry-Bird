<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<meta name="mobile-web-app-capable" content="yes">

<title>Stok Opname Harian · Hungry Bird</title>

<style>
:root{
  --navy:#1e2d48; --brass:#c9a24a; --paper:#eef1f6; --card:#ffffff; --ink:#1b2440; --muted:#6a7185; --line:#dce0e8;
  --ok:#2f8a5b; --ok-soft:#e3f3ea; --warn:#d6453d; --low:#b77d0f; --low-soft:#fbf1dc; --edit:#3d5afe; --edit-soft:#eef2ff;
  --area:#1e2d48;
  --font:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --display:'Bricolage Grotesque','Atkinson Hyperlegible',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);background:var(--paper);color:var(--ink);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.hidden{display:none!important}
.wrap{max-width:640px;margin:0 auto}

/* ---------- Login ---------- */
#login{min-height:100%;display:flex;flex-direction:column;justify-content:center;padding:32px 24px;
  padding-top:calc(32px + env(safe-area-inset-top));background:var(--navy);color:#fff;position:relative;overflow:hidden}
#login::after{content:'';position:absolute;right:-90px;top:-110px;width:300px;height:300px;border-radius:50%;
  border:36px solid rgba(201,162,74,.12);pointer-events:none}
#login .wrap{width:100%;position:relative;z-index:1}
.logo{display:block;height:34px;width:auto;max-width:75%;margin-bottom:36px}
#login h1{font-family:var(--display);font-weight:800;font-size:36px;line-height:1.02;letter-spacing:-.02em;margin:0 0 8px}
#login p{margin:0 0 30px;color:#b9c3d8}
#login label{display:block;font-size:14px;color:#b9c3d8;margin:16px 0 8px}
#login input{width:100%;padding:16px;border-radius:14px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);
  color:#fff;font-size:24px;letter-spacing:.35em;text-align:center;outline:none}
#login input::placeholder{color:#8e9bb7;letter-spacing:normal;font-size:16px}
#login input:focus{border-color:var(--brass)}
#login button{margin-top:24px;width:100%;padding:16px;border:0;border-radius:14px;background:var(--brass);color:var(--navy);font-weight:700;font-size:18px}
#loginErr{color:#ffb4a8;margin-top:14px;min-height:22px}

/* ---------- Header ---------- */
header{position:sticky;top:0;z-index:5;background:var(--area);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 16px;
  border-radius:0 0 22px 22px;box-shadow:0 10px 22px -14px rgba(30,45,72,.6);transition:background .25s}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ttl{flex:1;min-width:0}
.hdrLogo{display:block;height:20px;width:auto;margin-bottom:6px}
.back:not(.hidden) + .ttl .hdrLogo{display:none}
.top h1{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.01em;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.link,.back{border:0;color:#fff;background:rgba(255,255,255,.13);padding:8px 13px;border-radius:999px;font-size:14px;white-space:nowrap}
.back{font-weight:700;font-size:15px}
.dates{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:14px;background:rgba(0,0,0,.2);padding:4px;border-radius:14px}
.dates button{border:0;border-radius:11px;padding:8px 4px;background:none;color:rgba(255,255,255,.75);font-size:14px;line-height:1.25}
.dates button small{font-size:12px;opacity:.8}
.dates button[aria-pressed="true"]{background:#fff;color:var(--area);font-weight:700}
.prog{margin-top:14px;height:10px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden}
.prog i{display:block;height:100%;background:var(--brass);border-radius:99px;transition:width .3s}
.progTxt{font-size:13.5px;color:rgba(255,255,255,.85);margin-top:6px}

/* ---------- Home: kartu area ---------- */
#home{padding:16px}
.hint{color:var(--muted);font-size:14px;padding:6px 2px 12px}
.areaCard{position:relative;overflow:hidden;width:100%;display:grid;grid-template-columns:1fr auto;align-items:end;gap:4px 12px;
  text-align:left;border:0;border-radius:20px;padding:22px 20px 18px;margin-bottom:12px;color:#fff;
  box-shadow:0 12px 26px -16px rgba(30,45,72,.7);transition:transform .12s}
.areaCard:active{transform:scale(.985)}
.areaCard::after{content:'';position:absolute;right:-46px;top:-58px;width:160px;height:160px;border-radius:50%;
  border:24px solid rgba(255,255,255,.08);pointer-events:none}
.areaCard h2{font-family:var(--display);font-weight:800;margin:0;font-size:32px;letter-spacing:-.02em;line-height:1}
.areaCard small{display:block;opacity:.8;font-size:14.5px;margin-top:6px}
.areaCard .num{position:relative;z-index:1;font-family:var(--display);font-size:26px;font-weight:800;white-space:nowrap}
.areaCard .num.done::before{content:"✓ ";color:var(--brass)}
.aBar{grid-column:1/-1;display:block;height:6px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden;margin-top:12px}
.aBar b{display:block;height:100%;background:#fff;border-radius:99px}

/* ---------- Area: daftar item ---------- */
.tools{position:sticky;z-index:4;background:var(--paper);padding:12px 16px 10px;display:flex;gap:8px}
.tools input{flex:1;min-width:0;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:16px;outline:none;-webkit-appearance:none;appearance:none}
.tools input:focus{border-color:var(--area)}
.tools button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:0 14px;font-size:14px;font-weight:700;color:var(--muted);white-space:nowrap}
.tools button[aria-pressed="true"]{background:var(--area);border-color:var(--area);color:#fff}
#list{padding:0 16px 140px}
.sub{position:sticky;z-index:3;background:var(--paper);font-family:var(--display);font-weight:800;font-size:17px;color:var(--area);padding:16px 2px 8px}
.row{position:relative;display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:12px 12px 12px 16px;margin-bottom:8px;overflow:hidden}
.row::before{content:'';position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:var(--line)}
.row.filled{border-color:#cfe7da}
.row.filled::before{background:var(--ok)}
.row.edited{background:var(--edit-soft);border-color:#c9d3ff}
.row.edited::before{background:var(--edit)}
.row .info{flex:1;min-width:0}
.row .nm{font-weight:700;font-size:16px;line-height:1.3;overflow-wrap:anywhere}
.row .sub2{font-size:13px;color:var(--muted);margin-top:2px}
.row .flag{font-size:13px;font-weight:700;color:var(--low);margin-top:3px}
.row .flag:empty{display:none}
.row .flag.bad{color:var(--warn)}
.row input{width:92px;height:52px;flex:none;text-align:center;font-family:var(--display);font-size:22px;font-weight:800;padding:0 8px;
  border:1.5px solid var(--line);border-radius:12px;background:#f5f7fb;outline:none}
.row input:focus{border-color:var(--area);background:#fff;box-shadow:0 0 0 4px rgba(30,45,72,.08)}
.row.filled input{border-color:#b9dcc8;background:var(--ok-soft);color:var(--ok)}
.row.edited input{border-color:var(--edit);background:#fff;color:var(--ink)}
.empty,.loading{padding:48px 12px;color:var(--muted);text-align:center}

/* ---------- Dock simpan (melayang) ---------- */
.dock{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:6;max-width:620px;margin:0 auto;
  background:rgba(255,255,255,.96);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line);
  border-radius:18px;padding:10px 10px 10px 16px;box-shadow:0 16px 34px -14px rgba(30,45,72,.4)}
.dock .wrap{display:flex;gap:10px;align-items:center}
.dock .count{flex:1;font-size:14.5px;color:var(--muted);line-height:1.3}
.dock .count b{color:var(--ink)}
.btn{border:0;border-radius:12px;padding:14px 20px;font-weight:700;font-size:17px}
.btn.primary{background:var(--area);color:#fff}
.btn.ghost{background:none;border:1px solid var(--line)}
.btn:disabled{opacity:.35}

/* ---------- Sheet simpan ---------- */
.scrim{position:fixed;inset:0;background:rgba(20,28,45,.5);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:24px 24px 0 0;
  padding:12px 18px calc(20px + env(safe-area-inset-bottom));animation:up .22s ease-out}
.sheet::before{content:'';display:block;width:40px;height:5px;border-radius:99px;background:var(--line);margin:0 auto 16px}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.sheet h2{font-family:var(--display);font-weight:800;margin:0 0 4px;font-size:24px;letter-spacing:-.01em}
.sheet .meta{color:var(--muted);font-size:15px}
.field{margin-top:18px}
.field label{display:block;font-size:14px;color:var(--muted);margin-bottom:6px}
.field input{width:100%;padding:14px;border:1px solid var(--line);border-radius:12px;font-size:17px;outline:none}
.field input:focus{border-color:var(--area)}
.errTxt{color:var(--warn);font-size:14px;margin-top:6px;min-height:18px}
.warnBox{background:var(--low-soft);color:#7a5305;border-radius:12px;padding:12px 14px;font-size:15px;margin-top:14px}
.actions{display:grid;grid-template-columns:1fr 2fr;gap:10px;margin-top:18px}

/* ---------- PO WA ---------- */
.poEntry{width:100%;display:flex;align-items:center;gap:14px;text-align:left;background:var(--card);border:1.5px solid var(--line);
  border-radius:20px;padding:18px 18px;margin-top:4px;color:var(--ink)}
.poEntry .ic{width:46px;height:46px;border-radius:14px;background:#1f8a4c;color:#fff;display:grid;place-items:center;flex:none}
.poEntry b{display:block;font-family:var(--display);font-weight:800;font-size:20px}
.poEntry small{color:var(--muted);font-size:14px}
.poEntry .go{margin-left:auto;color:var(--muted);font-size:22px}
#poView{padding:8px 16px 40px}
.poInfo{color:var(--muted);font-size:14px;margin:8px 2px 12px}
.poStale{background:var(--low-soft);color:#7a5305;border-radius:12px;padding:12px 14px;font-size:14.5px;margin:8px 0 12px}
.poCard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.poHead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.poHead h3{margin:0;font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.01em}
.poHead small{color:var(--muted);font-size:13.5px;white-space:nowrap}
.poBtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.poBtns .btn{padding:12px 10px;font-size:15.5px}
.btn.wa{background:#1f8a4c;color:#fff}
.btn.done{background:var(--ok-soft);color:var(--ok);border:1px solid #b9dcc8}
.poCard details{margin-top:10px}
.poCard summary{color:var(--muted);font-size:14px;cursor:pointer;padding:4px 0}
.poText{white-space:pre-wrap;font-size:13.5px;background:var(--paper);border-radius:10px;padding:12px;margin-top:6px;line-height:1.45}

#toast{position:fixed;left:16px;right:16px;bottom:calc(96px + env(safe-area-inset-bottom));z-index:20;max-width:600px;margin:0 auto;
  background:var(--navy);color:#fff;border-radius:14px;padding:14px 16px;font-size:15.5px;font-weight:700;text-align:center;
  box-shadow:0 12px 28px -12px rgba(30,45,72,.5)}
#toast.err{background:var(--warn)}

@media (prefers-reduced-motion:reduce){.sheet{animation:none}header,.prog i,.areaCard{transition:none}}
</style>
</head>

<script>
/* ================== KONFIGURASI ================== */
const API_URL = 'https://script.google.com/macros/s/AKfycbxvmc1md8u5oeZ8IqYDLkeO4KzmnOwNC_NKsvREE68uqQ6Xn1JLjpuuXBDF5wp1lZ1X/exec';
const AREA_COLORS = { 'Bar': '#1A3C6E', 'Floor': '#533483', 'Kitchen': '#1B4332' };
/* ================================================= */

const $ = id => document.getElementById(id);
const LS = { pin: 'hbso_pin', name: 'hbso_name' };
const state = { data: null, today: '', date: '', area: null, edits: {}, onlyTodo: false, sid: newSid() };

function newSid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 10); }
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function num(v){ const t = String(v).trim().replace(',', '.'); if (t === '') return NaN; const n = Number(t); return isFinite(n) ? n : NaN; }
function fmt(n){ if (n === null || n === undefined || n === '') return '–'; if (typeof n !== 'number') return String(n); return String(Math.round(n * 100) / 100).replace('.', ','); }
function store(k, v){ try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch(e){} }
function load(k){ try { return localStorage.getItem(k) || ''; } catch(e){ return ''; } }
function isoShift(iso, days){ const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + days); return d.toISOString().slice(0, 10); }
const HARI = ['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
function dayLabel(iso){ const d = new Date(iso + 'T12:00:00'); return `${HARI[d.getDay()]} ${d.getDate()}/${d.getMonth()+1}`; }

/* ---------- Koneksi: fetch tanpa cookie (aman untuk browser multi-akun Google), cadangan JSONP ---------- */
async function api(params, opt){
  opt = opt || {};
  const q = new URLSearchParams({ ...params, pin: load(LS.pin) });
  let data;
  try {
    const ctrl = new AbortController(); const t = setTimeout(() => ctrl.abort(), opt.timeout || 30000);
    const res = await fetch(API_URL + '?' + q.toString(), { credentials: 'omit', redirect: 'follow', signal: ctrl.signal });
    clearTimeout(t); data = await res.json();
  } catch (e) {
    if (opt.noRetry && e.name === 'AbortError') throw new Error('Proses masih berjalan di server. Tunggu ±1 menit, lalu buka ulang PO WA.');
    data = await apiJsonp(params, opt.timeout);
  }
  if (!data || !data.ok) throw new Error((data && data.error) || 'Gagal memproses.');
  return data;
}
function apiJsonp(params, ms){
  return new Promise((resolve, reject) => {
    const cb = 'cb_' + newSid(); const s = document.createElement('script');
    const timer = setTimeout(() => { done(); reject(new Error('Koneksi lambat. Cek sinyal lalu coba lagi.')); }, ms || 30000);
    function done(){ clearTimeout(timer); delete window[cb]; s.remove(); }
    window[cb] = d => { done(); resolve(d); };
    s.onerror = () => { done(); reject(new Error('Tidak bisa terhubung ke server. Coba mode incognito.')); };
    s.src = API_URL + '?' + new URLSearchParams({ ...params, pin: load(LS.pin), callback: cb }).toString();
    document.body.appendChild(s);
  });
}
function toast(msg, isErr){
  const t = $('toast'); t.textContent = msg; t.className = isErr ? 'err' : '';
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.add('hidden'), isErr ? 5000 : 3000);
}

/* ---------- Login ---------- */
function showLogin(msg){
  $('app').classList.add('hidden'); $('login').classList.remove('hidden');
  $('inPin').value = ''; $('loginErr').textContent = msg || '';
}
$('btnLogin').onclick = async () => {
  const pin = $('inPin').value.trim();
  if (!pin){ $('loginErr').textContent = 'Isi PIN dulu.'; return; }
  store(LS.pin, pin); $('loginErr').textContent = 'Mengecek…';
  try { await loadDate(''); $('login').classList.add('hidden'); $('app').classList.remove('hidden'); showHome(); }
  catch(e){ store(LS.pin, null); showLogin(e.message); }
};
$('btnOut').onclick = () => {
  if (dirtyCount() && !confirm('Ada angka yang belum disimpan. Tetap keluar?')) return;
  state.edits = {}; store(LS.pin, null); showLogin();
};

/* ---------- Data ---------- */
async function loadDate(iso){
  const r = await api({ action: 'so_init', tanggal: iso });
  state.data = r; state.today = r.today; state.date = r.tanggal;
  renderDates();
}
function renderDates(){
  const opts = [0, -1, -2].map(d => isoShift(state.today, d));
  const names = ['Hari ini', 'Kemarin', '2 hari lalu'];
  $('dates').innerHTML = opts.map((iso, i) =>
    `<button data-iso="${iso}" aria-pressed="${iso === state.date}">${names[i]}<br><small>${dayLabel(iso)}</small></button>`).join('');
}
$('dates').addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b || b.dataset.iso === state.date) return;
  if (dirtyCount() && !confirm('Ada angka yang belum disimpan untuk tanggal ini. Pindah tanggal?')) return;
  state.edits = {}; state.sid = newSid();
  const areaName = state.area && state.area.name;
  $('list').innerHTML = '<div class="loading">Memuat…</div>';
  try {
    await loadDate(b.dataset.iso);
    if (areaName) openArea(areaName); else showHome();
  } catch(err){ toast(err.message, true); renderDates(); }
});
function areaItems(a){ return a.subs.flatMap(s => s.items); }
function filledCount(a){ return areaItems(a).filter(it => it.v !== null && it.v !== '').length; }

/* ---------- Home ---------- */
function showHome(){
  state.area = null;
  document.documentElement.style.setProperty('--area', '#1e2d48');
  $('title').textContent = 'Stok Opname Harian';
  $('btnBack').classList.add('hidden'); $('progWrap').classList.add('hidden');
  $('areaView').classList.add('hidden'); $('poView').classList.add('hidden'); $('dates').classList.remove('hidden');
  $('home').classList.remove('hidden');
  $('homeHint').textContent = `Tanggal ${dayLabel(state.date)} · sheet "${state.data.sheet}". Pilih area yang mau diisi.`;
  $('areaCards').innerHTML = state.data.areas.map(a => {
    const tot = areaItems(a).length, f = filledCount(a);
    return `<button class="areaCard" data-a="${esc(a.name)}" style="background:${AREA_COLORS[a.name] || '#374151'}">
      <span><h2>${esc(a.name)}</h2><small>${tot} item${a.subs.length > 1 ? ' · ' + a.subs.filter(s => s.name).length + ' lokasi' : ''}</small></span>
      <span class="num${f === tot ? ' done' : ''}">${f}/${tot}</span><i class="aBar"><b style="width:${tot ? f / tot * 100 : 0}%"></b></i></button>`;
  }).join('');
}
$('areaCards').addEventListener('click', e => { const b = e.target.closest('.areaCard'); if (b) openArea(b.dataset.a); });
$('btnBack').onclick = () => {
  if (dirtyCount() && !confirm('Ada angka yang belum disimpan. Kembali ke daftar area?')) return;
  state.edits = {}; showHome();
};

/* ---------- Area ---------- */
function openArea(name){
  const a = state.data.areas.find(x => x.name === name);
  if (!a){ showHome(); return; }
  state.area = a;
  document.documentElement.style.setProperty('--area', AREA_COLORS[a.name] || '#374151');
  $('title').textContent = a.name;
  $('btnBack').classList.remove('hidden'); $('progWrap').classList.remove('hidden');
  $('home').classList.add('hidden'); $('poView').classList.add('hidden'); $('dates').classList.remove('hidden');
  $('areaView').classList.remove('hidden');
  $('inSearch').value = '';
  renderList(); renderProgress();
  requestAnimationFrame(() => {
    const h = document.querySelector('header').offsetHeight;
    document.querySelector('.tools').style.top = h + 'px';
    const th = document.querySelector('.tools').offsetHeight;
    document.querySelectorAll('.sub').forEach(s => s.style.top = (h + th) + 'px');
  });
}
function flagFor(it, raw){
  const q = num(raw);
  if (isNaN(q)) return raw && String(raw).trim() ? { t: 'Bukan angka', bad: true } : null;
  // penjaga salah ketik (mis. 4200 padahal 420). Angka kecil (1 → 12 bungkus) tidak ditandai.
  if (typeof it.prev === 'number' && it.prev >= 5 && q >= it.prev * 10) return { t: `Cek lagi: 10× dari terakhir (${fmt(it.prev)})`, bad: true };
  if (typeof it.max === 'number' && it.max > 0 && q > it.max * 3) return { t: `Cek lagi: jauh di atas Max (${fmt(it.max)})`, bad: true };
  if (typeof it.min === 'number' && q <= it.min) return { t: `Di bawah/sama Min (${fmt(it.min)}) → perlu order`, bad: false };
  return null;
}
function rowHtml(it){
  const edited = Object.prototype.hasOwnProperty.call(state.edits, it.n);
  const shown = edited ? state.edits[it.n] : (it.v === null ? '' : fmt(it.v));
  const filled = it.v !== null && it.v !== '';
  const fl = flagFor(it, shown);
  const last = it.prev !== null ? `terakhir ${fmt(it.prev)} (tgl ${it.prevDay})` : 'belum ada data sebelumnya';
  return `<div class="row${filled ? ' filled' : ''}${edited ? ' edited' : ''}" data-n="${esc(it.n)}">
    <div class="info"><div class="nm">${esc(it.n)}</div>
      <div class="sub2">${esc(it.u)} · ${last}</div>
      <div class="flag${fl && fl.bad ? ' bad' : ''}">${fl ? esc(fl.t) : ''}</div></div>
    <input inputmode="decimal" enterkeyhint="next" autocomplete="off" value="${esc(shown)}" aria-label="Jumlah ${esc(it.n)} (${esc(it.u)})">
  </div>`;
}
function renderList(){
  const a = state.area, q = $('inSearch').value.trim().toLowerCase();
  const words = q.split(/\s+/).filter(Boolean);
  let html = '', any = false;
  a.subs.forEach(s => {
    const items = s.items.filter(it =>
      words.every(w => it.n.toLowerCase().includes(w)) &&
      (!state.onlyTodo || it.v === null || Object.prototype.hasOwnProperty.call(state.edits, it.n)));
    if (!items.length) return;
    any = true;
    if (s.name) html += `<div class="sub">${esc(s.name)}</div>`;
    html += items.map(rowHtml).join('');
  });
  $('list').innerHTML = any ? html : `<div class="empty">${state.onlyTodo ? 'Semua item di area ini sudah terisi. 👍' : 'Tidak ada item yang cocok.'}</div>`;
  const h = document.querySelector('header').offsetHeight, th = document.querySelector('.tools').offsetHeight;
  document.querySelectorAll('.sub').forEach(el => el.style.top = (h + th) + 'px');
  renderDock();
}
function renderProgress(){
  const a = state.area, tot = areaItems(a).length;
  const f = areaItems(a).filter(it => (it.v !== null && it.v !== '') || (state.edits[it.n] ?? '') !== '').length;
  $('progBar').style.width = (tot ? f / tot * 100 : 0) + '%';
  $('progTxt').textContent = `${f} dari ${tot} item terisi · ${dayLabel(state.date)}`;
}
function dirtyCount(){ return Object.keys(state.edits).length; }
function renderDock(){
  const n = dirtyCount();
  const invalid = Object.values(state.edits).filter(v => String(v).trim() !== '' && isNaN(num(v))).length;
  $('dockTxt').innerHTML = n ? `<b>${n} angka</b> belum disimpan${invalid ? ` · ${invalid} tidak valid` : ''}` : 'Semua angka sudah tersimpan';
  $('btnSave').disabled = !n || invalid > 0;
  $('btnSave').textContent = n ? `Simpan (${n})` : 'Simpan';
}
$('inSearch').addEventListener('input', renderList);
$('btnTodo').onclick = () => { state.onlyTodo = !state.onlyTodo; $('btnTodo').setAttribute('aria-pressed', state.onlyTodo); renderList(); };

$('list').addEventListener('input', e => {
  const inp = e.target; if (inp.tagName !== 'INPUT') return;
  const row = inp.closest('.row'), name = row.dataset.n;
  const it = areaItems(state.area).find(x => x.n === name);
  const orig = it.v === null ? '' : fmt(it.v);
  const val = inp.value.trim();
  if (val === orig || (val === '' && it.v === null)) delete state.edits[name];
  else state.edits[name] = inp.value;
  row.classList.toggle('edited', Object.prototype.hasOwnProperty.call(state.edits, name));
  const fl = flagFor(it, inp.value); const fe = row.querySelector('.flag');
  fe.textContent = fl ? fl.t : ''; fe.classList.toggle('bad', !!(fl && fl.bad));
  state.sid = newSid();
  renderDock(); renderProgress();
});
$('list').addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.target.tagName !== 'INPUT') return;
  e.preventDefault();
  const all = [...document.querySelectorAll('#list input')];
  const next = all[all.indexOf(e.target) + 1];
  if (next){ next.focus(); next.select(); } else e.target.blur();
});
$('list').addEventListener('focusin', e => { if (e.target.tagName === 'INPUT') setTimeout(() => e.target.select(), 0); });

/* ---------- Save ---------- */
$('btnSave').onclick = () => {
  const edits = Object.entries(state.edits);
  const cleared = edits.filter(([, v]) => String(v).trim() === '').length;
  const items = areaItems(state.area);
  const bad = edits.filter(([n, v]) => { const f = flagFor(items.find(x => x.n === n), v); return f && f.bad; }).length;
  $('saveMeta').textContent = `${state.area.name} · ${dayLabel(state.date)} · ${edits.length - cleared} angka akan disimpan`;
  const warns = [];
  if (bad) warns.push(`${bad} angka ditandai "cek lagi". Pastikan bukan salah ketik.`);
  if (cleared) warns.push(`${cleared} angka yang dikosongkan tidak akan dihapus dari sheet (minta supervisor kalau perlu dihapus).`);
  $('saveWarn').innerHTML = warns.map(esc).join('<br>');
  $('saveWarn').classList.toggle('hidden', !warns.length);
  $('staffName').value = load(LS.name); $('staffErr').textContent = '';
  $('saveScrim').classList.remove('hidden');
};
$('saveBack').onclick = () => $('saveScrim').classList.add('hidden');
$('saveGo').onclick = async () => {
  const staff = $('staffName').value.trim();
  if (!staff){ $('staffErr').textContent = 'Isi nama kamu dulu sebelum simpan.'; $('staffName').focus(); return; }
  store(LS.name, staff);
  const vals = Object.entries(state.edits).filter(([, v]) => String(v).trim() !== '').map(([n, v]) => ({ n, q: num(v) }));
  if (!vals.length){ $('saveScrim').classList.add('hidden'); state.edits = {}; renderList(); return; }
  const btn = $('saveGo'); btn.disabled = true; btn.textContent = 'Menyimpan…';
  try {
    const r = await api({ action: 'so_save', data: JSON.stringify({ staff, sid: state.sid, tanggal: state.date, area: state.area.name, vals }) });
    const areaName = state.area.name;
    state.edits = {}; state.sid = newSid();
    $('saveScrim').classList.add('hidden');
    toast(r.duplicate ? 'Sudah tersimpan sebelumnya.' : `${vals.length} angka tersimpan di sheet.`);
    await loadDate(state.date); openArea(areaName);
  } catch(e){
    toast(e.message + ' Angka di layar tidak hilang, tekan simpan lagi.', true);
    if (/PIN/i.test(e.message)){ store(LS.pin, null); showLogin(e.message); }
  } finally { btn.disabled = false; btn.textContent = 'Simpan ke sheet'; }
};

/* ---------- PO WA (baca sheet "PO WA" hasil Generate PO) ---------- */
$('btnPo').onclick = () => openPo();
async function openPo(){
  state.area = null;
  document.documentElement.style.setProperty('--area', '#1e2d48');
  $('title').textContent = 'PO WA';
  $('btnBack').classList.remove('hidden'); $('progWrap').classList.add('hidden'); $('dates').classList.add('hidden');
  $('home').classList.add('hidden'); $('areaView').classList.add('hidden');
  const v = $('poView'); v.classList.remove('hidden');
  v.innerHTML = '<div class="loading">Memuat PO…</div>';
  window.scrollTo(0, 0);
  try {
    const r = await api({ action: 'so_po' });
    state.po = r; renderPo();
  } catch(e){ v.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}
function fmtGen(g){
  const d = new Date(g.at); if (isNaN(d)) return '';
  const p2 = n => String(n).padStart(2, '0');
  return `${HARI[d.getDay()]} ${d.getDate()}/${d.getMonth() + 1} ${p2(d.getHours())}:${p2(d.getMinutes())}` + (g.by ? ` · ${g.by}` : '');
}
function renderPo(){
  const r = state.po, v = $('poView');
  const genHtml = `<div class="poCard"><div class="poHead"><h3>PO hari ini</h3></div>
    <div class="poInfo" style="margin:4px 0 0">${r.gen ? 'Terakhir dibuat: <b>' + esc(fmtGen(r.gen)) + '</b>' : 'Belum ada data pembuatan'}</div>
    <button class="btn primary" id="poGenBtn" style="width:100%;margin-top:12px">Buat / perbarui PO hari ini</button>
    <div class="poInfo" style="margin:8px 0 0">Tekan setelah semua area selesai opname. Aman ditekan ulang kalau ada opname susulan.</div></div>`;
  if (!r.blocks.length){ v.innerHTML = genHtml + `<div class="empty">${r.gen ? 'Semua stok aman, tidak ada yang perlu dipesan. 👍' : 'Belum ada PO. Tekan "Buat / perbarui PO hari ini".'}</div>`; return; }
  const stale = r.blocks.some(b => !b.today);
  v.innerHTML = genHtml + (stale
      ? `<div class="poStale">PO ini dibuat <b>${esc(r.blocks[0].date || 'bukan hari ini')}</b>, bukan hari ini. Tekan <b>Buat / perbarui PO hari ini</b> sebelum dikirim.</div>`
      : `<div class="poInfo">${r.blocks.length} supplier. Tekan Kirim ke WA, atau Salin lalu tempel di chat/grup supplier.</div>`) +
    r.blocks.map((b, i) => `<div class="poCard">
      <div class="poHead"><h3>${esc(b.sup)}</h3><small>${b.count} item</small></div>
      <div class="poBtns">
        <button class="btn ghost" data-copy="${i}">Salin teks</button>
        <button class="btn wa" data-wa="${i}">${b.wa ? 'Kirim ke WA' : 'Buka WA'}</button>
      </div>
      <details><summary>Lihat isi PO</summary><div class="poText">${esc(b.text)}</div></details>
    </div>`).join('');
}
async function copyText(t){
  try { await navigator.clipboard.writeText(t); return true; }
  catch(e){
    const ta = document.createElement('textarea'); ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch(_){}
    ta.remove(); return ok;
  }
}
$('poView').addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.copy !== undefined){
    const ok = await copyText(state.po.blocks[+b.dataset.copy].text);
    if (ok){ b.textContent = '✓ Tersalin'; b.classList.remove('ghost'); b.classList.add('done'); toast('Teks PO disalin. Tempel di chat WA supplier.'); }
    else toast('Gagal menyalin. Buka "Lihat isi PO", tekan lama teksnya, lalu salin.', true);
  } else if (b.dataset.wa !== undefined){
    const blk = state.po.blocks[+b.dataset.wa];
    window.open('https://wa.me/' + (blk.wa || '') + '?text=' + encodeURIComponent(blk.text), '_blank');
  } else if (b.id === 'poGenBtn'){
    if (!confirm('Buat PO dari data opname terbaru? Proses bisa ±1 menit. PO lama akan diganti.')) return;
    b.disabled = true; b.textContent = 'Membuat PO… (±1 menit)';
    try {
      const r = await api({ action: 'so_genpo', by: load(LS.name) || '' }, { timeout: 180000, noRetry: true });
      state.po = r; renderPo();
      toast(r.generated && r.generated.suppliers ? `PO dibuat: ${r.generated.suppliers} supplier.` : 'Semua stok aman, tidak ada yang perlu dipesan.');
    } catch(err){ toast(err.message, true); b.disabled = false; b.textContent = 'Buat / perbarui PO hari ini'; }
  }
});

/* ---------- Mulai ---------- */
window.addEventListener('beforeunload', e => { if (dirtyCount()){ e.preventDefault(); e.returnValue = ''; } });
if (load(LS.pin)){
  loadDate('').then(() => { $('app').classList.remove('hidden'); showHome(); })
    .catch(e => showLogin(e.message));
} else showLogin();
</script>
</body>
</html>
